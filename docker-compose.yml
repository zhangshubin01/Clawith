services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    restart: unless-stopped
    networks:
      - default
    environment:
      POSTGRES_USER: clawith
      POSTGRES_PASSWORD: clawith
      POSTGRES_DB: clawith
    volumes:
      - pgdata:/var/lib/postgresql/data
    # M1/8GB 调优参数（通过 ${PG_TUNING:-default} 控制）
    # 设为 "m1" 使用 M1 保守参数，默认不覆盖 PG 内置值
    command: ${PG_COMMAND:-}
    shm_size: 256m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U clawith" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    restart: unless-stopped
    networks:
      - default
    volumes:
      - redisdata:/data
    # M1/8GB: 设置 REDIS_COMMAND="redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --maxmemory-samples 10 --save '' --appendonly no --activedefrag yes"
    command: ${REDIS_COMMAND:-redis-server}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      args:
        CLAWITH_PIP_INDEX_URL: ${CLAWITH_PIP_INDEX_URL:-}
        CLAWITH_PIP_TRUSTED_HOST: ${CLAWITH_PIP_TRUSTED_HOST:-}
    platform: ${CLAWITH_PLATFORM:-}
    restart: unless-stopped
    # tini 作为 PID 1 收割孤儿进程：沙箱超时/取消时，内层进程（如用户代码里的
    # curl）可能比 bwrap 晚退出，被 reparent 到 PID 1；uvicorn 不收割未知子进程，
    # 这些孤儿会永久变成僵尸。init 后由 tini 统一 waitpid（P3 问题⑤）。
    init: true
    command: ["/bin/bash", "/app/entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://clawith:clawith@postgres:5432/clawith
      REDIS_URL: redis://redis:6379/0
      AGENT_DATA_DIR: /data/agents
      AGENT_TEMPLATE_DIR: /app/agent_template
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: /data/agents
      DOCKER_NETWORK: ${CLAWITH_DOCKER_NETWORK:-clawith_network}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-jwt-secret}
      PROCESS_ROLE: all
      AGENT_RUNTIME_COMMAND_CONCURRENCY: ${AGENT_RUNTIME_COMMAND_CONCURRENCY:-10}
      AGENT_RUNTIME_RECURSION_LIMIT: ${AGENT_RUNTIME_RECURSION_LIMIT:-200}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-4}
      AGENT_RUNTIME_V2_ENABLED: "true"
      AGENT_RUNTIME_V2_AGENT_IDS: ""
      AGENT_RUNTIME_V2_SOURCE_TYPES: ""
      SANDBOX_DEFAULT_TIMEOUT: ${SANDBOX_DEFAULT_TIMEOUT:-180}
      SANDBOX_MAX_TIMEOUT: ${SANDBOX_MAX_TIMEOUT:-300}
      CORS_ORIGINS: '["*"]'
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_DOMAIN: ${FEISHU_DOMAIN:-https://open.larksuite.com}
      SS_CONFIG_FILE: /data/ss-nodes.json
      # Android 构建沙箱镜像
      DEVBOX_ANDROID_IMAGE: ${DEVBOX_ANDROID_IMAGE:-clawith-devbox-android:latest}
      # Public base URL for constructing OAuth callback URLs and email links.
      # Required when deployed behind a reverse proxy (e.g. Nginx, Cloudflare).
      # If not set, the server infers the URL from the incoming request host.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Platform-scoped models used by native Group planning and threshold-only
      # shared Session Context compaction.
      MULTI_AGENT_PLANNING_MODEL_ID: ${MULTI_AGENT_PLANNING_MODEL_ID:-}
      MULTI_AGENT_COMPACT_MODEL_ID: ${MULTI_AGENT_COMPACT_MODEL_ID:-}
      # Password reset token lifetime in minutes (default: 30)
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      # Observability (Langfuse trace export; values come from repo .env)
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      # Multi-tenant isolation: JSON map tenant_id -> {public_key, secret_key}
      LANGFUSE_TENANT_KEYS: ${LANGFUSE_TENANT_KEYS:-}
      # OTel service identity for Langfuse/OTel exporters (UI grouping; defaults to unknown_service)
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-clawith-backend}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8008}:8000"
    volumes:
      - agentdata:/data/agents
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ss-nodes.json:/data/ss-nodes.json:ro
    # P2 最小权限收紧（2026-08-16 实测）：去 privileged，仅保留 bwrap 沙箱所需。
    # SYS_ADMIN：命名空间与 pivot_root；NET_ADMIN+SYS_PTRACE：bwrap 0.11 set_required_caps
    # 硬性要求且不在 Docker 默认 caps 内（缺失时 setuid bwrap 报 "capset failed"）。
    # OrbStack 默认 seccomp 会拦 bwrap 的 mount/pivot_root，必须 security_opt seccomp=unconfined
    # （原注释「macOS/OrbStack 不可用」有误，实测该选项在 OrbStack 上生效）。
    group_add:
      - "0"  # root 组（docker.sock 属主），clawith 用户通过此组访问 Docker
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    networks:
      - default
      - openviking-shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build: ./frontend
    platform: ${CLAWITH_PLATFORM:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3008}:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      API_UPSTREAM: ${API_UPSTREAM:-backend:8000}
      MINIO_UPSTREAM: ${MINIO_UPSTREAM:-minio:9000}
    volumes:
      - ./frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - default
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  agentdata:


networks:
  default:
    name: ${CLAWITH_DOCKER_NETWORK:-clawith_network}
  openviking-shared:
    external: true
